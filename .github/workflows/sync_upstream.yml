name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/OpenListTeam/OpenList.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into main
        if: steps.fetch.outputs.pending == 'true'
        id: merge
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if git merge --no-ff --no-edit -m "chore(sync): merge upstream OpenListTeam/OpenList main" upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
          fi

      - name: Verify merged tree
        if: steps.merge.outputs.clean == 'true'
        id: verify
        run: |
          if go build ./... && go test ./drivers/s3/...; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged main
        if: steps.verify.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:main
          gh workflow run docker.yml --ref main

      - name: Report conflict or failed verification
        if: steps.merge.outputs.clean == 'false' || steps.verify.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.merge.outputs.clean == 'false' && 'merge conflict' || 'build or test failure after clean merge' }}
        run: |
          if [ -f conflicts.txt ]; then
            files=$(sed 's/^/- /' conflicts.txt)
          else
            files="(see workflow run log)"
          fi
          gh issue create \
            --title "Upstream sync needs manual resolution" \
            --body "$(printf 'Upstream OpenListTeam/OpenList main could not be merged automatically (%s).\n\nConflicting files:\n%s\n\nResolve by running:\n\n```\ngit remote add upstream %s\ngit fetch upstream main\ngit merge upstream/main\n```\n\nRun: %s/actions/runs/%s' "$REASON" "$files" "$UPSTREAM_URL" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
